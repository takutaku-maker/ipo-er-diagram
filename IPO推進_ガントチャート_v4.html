<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPO推進 ガントチャート v4 (Portfolio)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --accent: #FEDA3E;
  --dark: #333333;
  --gray: #626161;
  --darkGray: #4D4D4D;
  --lightBg: #FFFBEC;
  --midGray: #E0E0E0;
  --white: #FFFFFF;
  --info-col-width: 560px;
  --name-w: 260px;
  --proj-w: 100px;
  --assignee-w: 80px;
  --due-w: 80px;
  --status-w: 40px;
  --row-height: 32px;
  --subtask-row-height: 28px;
  --group-header-height: 35px;
  --month-width: 60px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Noto Sans JP',sans-serif; background:var(--white); color:var(--dark); display:flex; flex-direction:column; height:100vh; overflow:hidden; }

.header { position:sticky; top:0; z-index:100; background:var(--dark); color:var(--white); padding:10px 24px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.header h1 { font-size:18px; font-weight:700; }
.header-right { display:flex; align-items:center; gap:14px; font-size:13px; }
.legend { display:flex; gap:10px; align-items:center; }
.legend-item { display:flex; align-items:center; gap:4px; font-size:11px; }
.legend-swatch { width:13px; height:13px; border-radius:2px; border:1px solid var(--midGray); }
.refresh-btn { background:var(--accent); color:var(--dark); border:none; border-radius:4px; padding:5px 12px; font-size:12px; font-weight:700; font-family:'Noto Sans JP',sans-serif; cursor:pointer; display:flex; align-items:center; gap:6px; transition:opacity 0.2s; }
.refresh-btn:hover { opacity:0.85; }
.refresh-btn:disabled { opacity:0.5; cursor:not-allowed; }
.refresh-btn .spinner { display:none; width:14px; height:14px; border:2px solid var(--dark); border-top-color:transparent; border-radius:50%; animation:spin 0.8s linear infinite; }
.refresh-btn.loading .spinner { display:inline-block; }
.refresh-btn.loading .btn-text { display:none; }
@keyframes spin { to { transform:rotate(360deg); } }
.update-info { font-size:11px; color:#aaa; display:flex; flex-direction:column; align-items:flex-end; line-height:1.3; }

.filter-bar { flex-shrink:0; background:#f8f8f8; border-bottom:1px solid var(--midGray); padding:8px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.filter-bar label { font-size:11px; font-weight:700; color:var(--gray); }
.filter-bar select, .filter-bar input[type="text"] { font-family:'Noto Sans JP',sans-serif; font-size:12px; padding:4px 8px; border:1px solid var(--midGray); border-radius:4px; background:var(--white); color:var(--dark); }
.filter-bar select { min-width:120px; }
.filter-bar input[type="text"] { width:160px; }
.filter-group { display:flex; align-items:center; gap:4px; }
.filter-count { font-size:11px; color:var(--gray); margin-left:auto; }
.filter-reset { font-size:11px; color:#1565C0; cursor:pointer; background:none; border:none; font-family:'Noto Sans JP',sans-serif; text-decoration:underline; }
.preset-btn { font-family:'Noto Sans JP',sans-serif; font-size:11px; font-weight:700; padding:4px 10px; border-radius:4px; cursor:pointer; transition:all 0.2s; border:1.5px solid; }
.preset-btn.audit { background:#FFF3E0; color:#E65100; border-color:#FF9800; }
.preset-btn.audit:hover { background:#FFE0B2; }
.preset-btn.audit.active { background:#FF9800; color:#fff; }
.preset-btn.urgent { background:#FFEBEE; color:#C62828; border-color:#E53935; }
.preset-btn.urgent:hover { background:#FFCDD2; }
.preset-btn.urgent.active { background:#E53935; color:#fff; }
.preset-btn.active-tasks { background:#FFFDE7; color:#F57F17; border-color:var(--accent); }
.preset-btn.active-tasks:hover { background:#FFF9C4; }
.preset-btn.active-tasks.active { background:var(--accent); color:var(--dark); }
.filter-divider { width:1px; height:24px; background:var(--midGray); margin:0 4px; }

.timeline-header-wrapper { flex-shrink:0; overflow:hidden; border-bottom:2px solid var(--dark); background:var(--lightBg); }
.timeline-header-inner { display:flex; min-width:max-content; }
.timeline-header-info { position:sticky; left:0; z-index:10; width:var(--info-col-width); min-width:var(--info-col-width); background:var(--lightBg); display:flex; align-items:flex-end; border-right:1px solid var(--midGray); font-size:11px; font-weight:700; }
.th-name { width:var(--name-w); padding:8px 12px; }
.th-proj { width:var(--proj-w); padding:8px 4px; text-align:center; }
.th-assignee { width:var(--assignee-w); padding:8px 4px; text-align:center; }
.th-due { width:var(--due-w); padding:8px 4px; text-align:center; }
.th-status { width:var(--status-w); padding:8px 4px; text-align:center; }
.timeline-months { display:flex; }
.year-group { display:flex; flex-direction:column; }
.year-label { text-align:center; font-size:12px; font-weight:700; padding:4px 0; border-bottom:1px solid var(--midGray); }
.month-row { display:flex; }
.month-cell { width:var(--month-width); text-align:center; font-size:10px; padding:4px 0; border-right:1px solid #eee; }
.month-cell.quarter-start { border-right:1px solid var(--midGray); }

.gantt-body { flex:1; overflow:auto; position:relative; }
.gantt-body-inner { position:relative; min-height:100%; }

.gantt-row { display:flex; height:var(--row-height); border-bottom:1px solid #f0f0f0; align-items:center; }
.gantt-row:hover { background:var(--lightBg); }
.group-header { display:flex; height:var(--group-header-height); align-items:center; border-bottom:1px solid var(--midGray); }

.row-info { position:sticky; left:0; z-index:5; width:var(--info-col-width); min-width:var(--info-col-width); display:flex; align-items:center; height:100%; background:var(--white); border-right:1px solid var(--midGray); }
.gantt-row:hover .row-info { background:var(--lightBg); }
.group-header .row-info { color:var(--white); }
.col-name { width:var(--name-w); padding:0 10px; display:flex; align-items:center; gap:5px; font-size:12px; overflow:hidden; white-space:nowrap; }
.col-proj { width:var(--proj-w); font-size:9px; text-align:center; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; padding:0 4px; }
.proj-badge { display:inline-block; padding:1px 6px; border-radius:3px; font-weight:500; }
.col-assignee { width:var(--assignee-w); font-size:10px; text-align:center; color:var(--gray); overflow:hidden; white-space:nowrap; text-overflow:ellipsis; padding:0 4px; }
.col-due { width:var(--due-w); font-size:10px; text-align:center; color:var(--gray); padding:0 4px; }
.col-due.overdue { color:#C62828; font-weight:700; }
.col-due.soon { color:#E65100; }
.col-status { width:var(--status-w); text-align:center; padding:0 2px; }
.status-chip { display:inline-block; font-size:9px; font-weight:700; padding:1px 6px; border-radius:3px; white-space:nowrap; }
.status-chip.in-progress { background:var(--accent); color:var(--dark); }
.status-chip.not-started { background:#f0f0f0; color:var(--gray); }
.status-chip.completed { background:var(--midGray); color:var(--white); }
.status-chip.no-status { background:#f5f5f5; color:#bbb; }
.group-header .col-name { font-weight:700; font-size:12px; letter-spacing:0.5px; }
.group-count { font-size:11px; opacity:0.8; margin-left:6px; }
.group-progress { font-size:10px; opacity:0.7; margin-left:auto; margin-right:12px; }

.status-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.status-dot.in-progress { background:var(--accent); }
.status-dot.not-started { background:var(--lightBg); border:1px solid var(--midGray); }
.status-dot.completed { background:var(--midGray); }
.status-dot.no-status { background:#ccc; }

.toggle-arrow { cursor:pointer; font-size:10px; color:var(--gray); user-select:none; flex-shrink:0; }
.toggle-arrow:hover { color:var(--dark); }
.task-name-text { overflow:hidden; text-overflow:ellipsis; }
.subtask-badge { font-size:10px; color:var(--gray); flex-shrink:0; }
.ms-icon { flex-shrink:0; width:10px; height:10px; transform:rotate(45deg); border:1.5px solid var(--dark); background:var(--accent); display:inline-block; }
.row-bars { flex:1; position:relative; height:100%; }

.gantt-bar { position:absolute; height:14px; top:50%; transform:translateY(-50%); border-radius:3px; }
.gantt-bar.in-progress { background:var(--accent); }
.gantt-bar.not-started { background:var(--lightBg); border:1px solid var(--midGray); }
.gantt-bar.completed { background:var(--midGray); }
.gantt-bar.no-status { background:#e0e0e0; border:1px solid #ccc; }

.milestone-marker { position:absolute; width:14px; height:14px; top:50%; transform:translateY(-50%) rotate(45deg); border:2px solid var(--dark); }
.milestone-marker.in-progress { background:var(--accent); }
.milestone-marker.not-started { background:var(--lightBg); }
.milestone-marker.completed { background:var(--midGray); }
.milestone-marker.no-status { background:#ddd; }

.subtask-row { height:var(--subtask-row-height); display:none; background:#fafafa; }
.subtask-row.visible { display:flex; }
.subtask-row .row-info { background:#fafafa; }
.subtask-row .col-name { padding-left:36px; font-size:11px; color:var(--gray); }
.subtask-row:hover .row-info { background:var(--lightBg); }
.subtask-line { position:absolute; height:6px; top:50%; transform:translateY(-50%); background:var(--midGray); border-radius:2px; opacity:0.5; }

.quarter-line { position:absolute; top:0; bottom:0; width:1px; background:var(--midGray); opacity:0.4; z-index:1; }
.today-line { position:absolute; top:0; bottom:0; width:2px; background:#E53935; z-index:3; }
.today-label { position:absolute; top:0; left:-14px; background:#E53935; color:white; font-size:9px; font-weight:700; padding:1px 5px; border-radius:2px; opacity:0.5; }

.tooltip { position:fixed; background:var(--dark); color:var(--white); padding:8px 12px; border-radius:4px; font-size:12px; line-height:1.5; z-index:200; pointer-events:none; display:none; max-width:360px; }
.footer { flex-shrink:0; text-align:center; padding:6px; font-size:13px; color:var(--gray); border-top:1px solid var(--midGray); background:var(--white); }

.overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1000; display:flex; align-items:center; justify-content:center; }
.overlay.hidden { display:none; }
.dialog { background:var(--white); border-radius:8px; padding:32px; max-width:480px; width:90%; box-shadow:0 8px 32px rgba(0,0,0,0.2); }
.dialog h2 { font-size:18px; margin-bottom:12px; }
.dialog p { font-size:13px; color:var(--gray); margin-bottom:16px; line-height:1.6; }
.dialog input[type="text"] { width:100%; padding:10px 12px; font-size:14px; font-family:monospace; border:1px solid var(--midGray); border-radius:4px; margin-bottom:16px; }
.dialog .btn-row { display:flex; gap:8px; justify-content:flex-end; }
.dialog button { padding:8px 20px; font-size:13px; font-family:'Noto Sans JP',sans-serif; border:none; border-radius:4px; cursor:pointer; font-weight:700; }
.dialog .btn-primary { background:var(--accent); color:var(--dark); }

.loading-overlay { position:fixed; inset:0; background:rgba(255,255,255,0.9); z-index:500; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; }
.loading-overlay.hidden { display:none; }
.loading-spinner { width:40px; height:40px; border:4px solid var(--midGray); border-top-color:var(--accent); border-radius:50%; animation:spin 0.8s linear infinite; }
.loading-text { font-size:14px; color:var(--gray); }

.error-banner { background:#FFEBEE; color:#C62828; padding:10px 24px; font-size:13px; display:none; align-items:center; gap:8px; flex-shrink:0; }
.error-banner.visible { display:flex; }
.error-banner .close-err { margin-left:auto; background:none; border:none; color:#C62828; font-size:16px; cursor:pointer; }

.summary-bar { flex-shrink:0; background:#fafafa; border-bottom:1px solid var(--midGray); padding:6px 16px; display:flex; align-items:center; gap:16px; font-size:11px; }
.summary-stat { display:flex; align-items:center; gap:4px; }
.summary-stat .dot { width:10px; height:10px; border-radius:2px; }
.summary-bar .progress-bar-bg { flex:1; max-width:200px; height:8px; background:#eee; border-radius:4px; overflow:hidden; }
.summary-bar .progress-bar-fill { height:100%; background:var(--accent); border-radius:4px; transition:width 0.3s; }
</style>
</head>
<body>

<div class="overlay hidden" id="patDialog">
  <div class="dialog">
    <h2>Asana Personal Access Token</h2>
    <p>Asana APIに接続するためにPersonal Access Tokenが必要です。<br><a href="https://app.asana.com/0/my-apps" target="_blank" style="color:#1565C0">Asana Developer Console</a>で発行できます。</p>
    <input type="text" id="patInput" placeholder="1/12345678:abcdef..." autocomplete="off">
    <div class="btn-row"><button class="btn-primary" id="patSave">接続</button></div>
  </div>
</div>

<div class="loading-overlay hidden" id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div class="loading-text" id="loadingText">Asanaからデータを取得中...</div>
</div>

<div class="error-banner" id="errorBanner">
  <span id="errorMsg"></span>
  <button class="close-err" id="closeErr">&times;</button>
</div>

<div class="header">
  <h1>IPO推進 ガントチャート <span style="font-size:12px;color:var(--accent);font-weight:400">v4 PORTFOLIO</span></h1>
  <div class="header-right">
    <div class="legend">
      <div class="legend-item"><div class="legend-swatch" style="background:var(--accent)"></div>仕掛中</div>
      <div class="legend-item"><div class="legend-swatch" style="background:var(--lightBg);border:1px solid var(--midGray)"></div>未着手</div>
      <div class="legend-item"><div class="legend-swatch" style="background:var(--midGray)"></div>完了</div>
      <div class="legend-item"><div style="width:11px;height:11px;transform:rotate(45deg);border:2px solid var(--dark);background:var(--accent)"></div>MS</div>
    </div>
    <div class="update-info">
      <span id="taskCount">-- tasks</span>
      <span id="lastUpdate">--</span>
    </div>
    <button class="refresh-btn" id="refreshBtn" title="最新データを取得">
      <div class="spinner"></div>
      <span class="btn-text">&#x21bb; 更新</span>
    </button>
    <button class="refresh-btn" id="settingsBtn" title="PAT設定" style="background:#555;color:#fff;padding:5px 10px;">
      <span>&#x2699;</span>
    </button>
  </div>
</div>

<div class="filter-bar" id="filterBar">
  <div class="filter-group">
    <label>プリセット:</label>
    <button class="preset-btn audit" id="presetAudit" title="期日30日以内+期日超過+仕掛中+MS">&#x1F4CB; 監査法人定例</button>
    <button class="preset-btn urgent" id="presetUrgent" title="期日超過タスクのみ">&#x1F534; 期日超過</button>
    <button class="preset-btn active-tasks" id="presetActive" title="仕掛中タスクのみ">&#x26A1; 仕掛中</button>
  </div>
  <div class="filter-divider"></div>
  <div class="filter-group">
    <label>プロジェクト:</label>
    <select id="filterProject"><option value="all">すべて</option></select>
  </div>
  <div class="filter-group">
    <label>種別:</label>
    <select id="filterType"><option value="all">すべて</option><option value="milestone">MSのみ</option><option value="task">タスクのみ</option></select>
  </div>
  <div class="filter-group">
    <label>ステータス:</label>
    <select id="filterStatus"><option value="all">すべて</option><option value="仕掛中">仕掛中</option><option value="未着手">未着手</option><option value="完了">完了</option><option value="none">未設定</option></select>
  </div>
  <div class="filter-group">
    <label>担当者:</label>
    <select id="filterAssignee"><option value="all">すべて</option></select>
  </div>
  <div class="filter-group">
    <label>検索:</label>
    <input type="text" id="filterSearch" placeholder="タスク名で検索...">
  </div>
  <span class="filter-count" id="filterCount"></span>
  <button class="filter-reset" id="filterReset">リセット</button>
</div>

<div class="summary-bar" id="summaryBar"><span>読み込み中...</span></div>

<div class="timeline-header-wrapper" id="timelineHeader"></div>

<div class="gantt-body" id="ganttBody">
  <div class="gantt-body-inner" id="ganttInner"></div>
</div>

<div class="tooltip" id="tooltip"></div>
<div class="footer">Copyrights &copy; 2026 REVISE Co.Ltd., All Rights Reserved</div>

<script>
var PROJECTS = [
  { gid:'1214628661355739', name:'機関設計・ガバナンス', color:'#4186E0', short:'機関設計' },
  { gid:'1214629191807667', name:'財務・決算・J-SOX', color:'#59CB59', short:'財務' },
  { gid:'1214628662087313', name:'人事・労務', color:'#EC8D3B', short:'人事労務' },
  { gid:'1214628737946008', name:'ISMS・IT統制', color:'#4BC9CA', short:'ISMS' },
  { gid:'1214628969493201', name:'コンプラ・リスク管理', color:'#E8384F', short:'コンプラ' },
  { gid:'1214628881874605', name:'資本政策・上場準備', color:'#8D8D8D', short:'資本政策' },
  { gid:'1214347783106959', name:'関連当事者・組織整理', color:'#EEC300', short:'関連当事者' },
  { gid:'1214628881129837', name:'規程整備', color:'#7A6FF0', short:'規程整備' }
];
var ASANA_BASE = 'https://app.asana.com/api/1.0';
var DATA = [], SUBTASKS = {}, FILTERED = [], lastFetchTime = null, activePreset = null;
var _pat = '';

var TIMELINE_START = new Date(2026,0,1), TIMELINE_END = new Date(2029,5,30);
var MONTH_WIDTH = 60, INFO_COL_WIDTH = 560;

function getTodayStr() { var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

var months = [];
(function(){ var c=new Date(TIMELINE_START); while(c<=TIMELINE_END){ months.push({year:c.getFullYear(),month:c.getMonth()}); c.setMonth(c.getMonth()+1); } })();
var TOTAL_WIDTH = months.length * MONTH_WIDTH;

function getPAT() {
  if (_pat) return _pat;
  try { var v = localStorage.getItem('asana_pat'); if(v) { _pat=v; return v; } } catch(e){}
  return '';
}
function savePAT(pat) {
  _pat = pat;
  try { localStorage.setItem('asana_pat', pat); } catch(e){}
}

async function fetchProjectTasks(projectGid) {
  var fields='name,start_on,due_on,completed,resource_subtype,tags.name,custom_fields.display_value,custom_fields.name,num_subtasks,assignee.name,memberships.project.gid';
  var all=[], offset=null;
  do {
    var url='/tasks?project='+projectGid+'&opt_fields='+fields+'&limit=100';
    if(offset) url+='&offset='+offset;
    var res=await fetch(ASANA_BASE+url,{headers:{'Authorization':'Bearer '+getPAT()}});
    if(!res.ok){ if(res.status===401||res.status===403) throw new Error('認証エラー: PATが無効です。'); throw new Error('Asana API error: '+res.status); }
    var json=await res.json();
    all=all.concat(json.data);
    offset=json.next_page?json.next_page.offset:null;
  } while(offset);
  return all;
}

function parseTask(raw, projInfo) {
  var status='';
  if(raw.custom_fields){ for(var i=0;i<raw.custom_fields.length;i++){ var cf=raw.custom_fields[i]; if(cf.name==='ステータス'||cf.name==='Status'){status=cf.display_value||'';break;} } }
  var tags=(raw.tags||[]).map(function(t){return t.name}).join(', ');
  return { gid:raw.gid, n:raw.name, s:raw.start_on||'', d:raw.due_on||'', c:raw.completed, t:raw.resource_subtype||'default_task', tag:tags, st:status, ns:raw.num_subtasks||0, assignee:raw.assignee?raw.assignee.name:'', proj:projInfo.name, projShort:projInfo.short, projColor:projInfo.color, projGid:projInfo.gid };
}

async function fetchSubtasks(gid) {
  var res=await fetch(ASANA_BASE+'/tasks/'+gid+'/subtasks?opt_fields=name',{headers:{'Authorization':'Bearer '+getPAT()}});
  if(!res.ok) return [];
  return (await res.json()).data.map(function(s){return{n:s.name}});
}

async function loadData() {
  var el=document.getElementById('loadingOverlay'), lt=document.getElementById('loadingText');
  el.classList.remove('hidden');
  try {
    var seen={};
    DATA=[];
    for(var i=0;i<PROJECTS.length;i++){
      var proj=PROJECTS[i];
      lt.textContent=proj.name+' を取得中... ('+(i+1)+'/'+PROJECTS.length+')';
      var raw=await fetchProjectTasks(proj.gid);
      for(var j=0;j<raw.length;j++){
        if(!seen[raw[j].gid]){ seen[raw[j].gid]=true; DATA.push(parseTask(raw[j],proj)); }
      }
    }
    SUBTASKS={};
    var withSubs=DATA.filter(function(t){return t.ns>0});
    for(var i=0;i<withSubs.length;i++){
      lt.textContent='サブタスクを取得中 ('+(i+1)+'/'+withSubs.length+')...';
      try{SUBTASKS[withSubs[i].gid]=await fetchSubtasks(withSubs[i].gid);}catch(e){}
    }
    lastFetchTime=new Date();
    populateFilters();
    applyFilters();
    hideError();
  } catch(e){ showError(e.message); } finally { el.classList.add('hidden'); }
}

function populateFilters() {
  var psel=document.getElementById('filterProject');
  psel.innerHTML='<option value="all">すべて</option>';
  PROJECTS.forEach(function(p){ var o=document.createElement('option'); o.value=p.gid; o.textContent=p.name; psel.appendChild(o); });
  var assignees=[]; var seen={};
  DATA.forEach(function(t){ if(t.assignee&&!seen[t.assignee]){seen[t.assignee]=true;assignees.push(t.assignee);} });
  assignees.sort(function(a,b){return a.localeCompare(b,'ja')});
  var asel=document.getElementById('filterAssignee');
  asel.innerHTML='<option value="all">すべて</option><option value="none">未割当</option>';
  assignees.forEach(function(a){ var o=document.createElement('option'); o.value=a; o.textContent=a; asel.appendChild(o); });
}

function applyFilters() {
  var type=document.getElementById('filterType').value;
  var status=document.getElementById('filterStatus').value;
  var assignee=document.getElementById('filterAssignee').value;
  var project=document.getElementById('filterProject').value;
  var search=document.getElementById('filterSearch').value.trim().toLowerCase();
  var now=new Date(); now.setHours(0,0,0,0);

  FILTERED=DATA.filter(function(t){
    if(activePreset==='audit'){
      if(t.c||t.st==='完了') return false;
      var ip=t.st==='仕掛中';
      var od=t.d&&new Date(t.d+'T00:00:00')<now;
      var ds=t.d&&!od&&((new Date(t.d+'T00:00:00')-now)/86400000)<=30;
      var ms=t.t==='milestone';
      if(!ip&&!od&&!ds&&!ms) return false;
    }
    if(activePreset==='urgent'){
      if(t.c||t.st==='完了') return false;
      if(!t.d||new Date(t.d+'T00:00:00')>=now) return false;
    }
    if(activePreset==='active'){ if(t.st!=='仕掛中') return false; }
    if(type==='milestone'&&t.t!=='milestone') return false;
    if(type==='task'&&t.t==='milestone') return false;
    if(status!=='all'){
      if(status==='none'){if(t.c||t.st) return false;}
      else if(status==='完了'){if(!t.c&&t.st!=='完了') return false;}
      else if(t.st!==status) return false;
    }
    if(assignee==='none'){if(t.assignee) return false;}
    else if(assignee!=='all'&&t.assignee!==assignee) return false;
    if(project!=='all'&&t.projGid!==project) return false;
    if(search&&!t.n.toLowerCase().includes(search)) return false;
    return true;
  });
  document.getElementById('filterCount').textContent=FILTERED.length+' / '+DATA.length+' 件表示';
  updateSummary();
  rebuildChart();
}

function updateSummary(){
  var total=DATA.length;
  var completed=DATA.filter(function(t){return t.c||t.st==='完了'}).length;
  var inProg=DATA.filter(function(t){return t.st==='仕掛中'}).length;
  var notSt=DATA.filter(function(t){return t.st==='未着手'}).length;
  var now=new Date();now.setHours(0,0,0,0);
  var overdue=DATA.filter(function(t){return!t.c&&t.st!=='完了'&&t.d&&new Date(t.d+'T00:00:00')<now}).length;
  var pct=total>0?Math.round((completed/total)*100):0;
  document.getElementById('summaryBar').innerHTML=
    '<div class="summary-stat"><div class="dot" style="background:var(--accent)"></div>仕掛中: <b>'+inProg+'</b></div>'+
    '<div class="summary-stat"><div class="dot" style="background:#f0f0f0;border:1px solid #ccc"></div>未着手: <b>'+notSt+'</b></div>'+
    '<div class="summary-stat"><div class="dot" style="background:var(--midGray)"></div>完了: <b>'+completed+'</b></div>'+
    (overdue>0?'<div class="summary-stat" style="color:#C62828"><div class="dot" style="background:#E53935"></div>期日超過: <b>'+overdue+'</b></div>':'')+
    '<div class="summary-stat">全体進捗: <b>'+pct+'%</b></div>'+
    '<div class="progress-bar-bg"><div class="progress-bar-fill" style="width:'+pct+'%"></div></div>';
}

function dateToX(ds){ if(!ds)return null; var d=new Date(ds+'T00:00:00'); return((d-TIMELINE_START)/(TIMELINE_END-TIMELINE_START))*TOTAL_WIDTH; }
function getStatusClass(t){ if(t.c||t.st==='完了')return'completed'; if(t.st==='仕掛中')return'in-progress'; if(t.st==='未着手')return'not-started'; return'no-status'; }
function getStatusLabel(t){ if(t.c||t.st==='完了')return'完了'; if(t.st==='仕掛中')return'仕掛中'; if(t.st==='未着手')return'未着手'; return'−'; }
function formatDue(d){ if(!d)return''; return d.replace(/^\d{4}-/,'').replace('-','/'); }
function getDueClass(t){ if(t.c||t.st==='完了'||!t.d)return''; var due=new Date(t.d+'T00:00:00'); var now=new Date();now.setHours(0,0,0,0); var diff=(due-now)/86400000; if(diff<0)return'overdue'; if(diff<=14)return'soon'; return''; }

function buildTimelineHeader(){
  var w=document.getElementById('timelineHeader'); w.innerHTML='';
  var inner=document.createElement('div'); inner.className='timeline-header-inner';
  var info=document.createElement('div'); info.className='timeline-header-info';
  info.innerHTML='<div class="th-name">タスク名</div><div class="th-proj">プロジェクト</div><div class="th-assignee">担当者</div><div class="th-due">期日</div><div class="th-status">状態</div>';
  inner.appendChild(info);
  var ma=document.createElement('div'); ma.className='timeline-months';
  var yg={}; months.forEach(function(m){if(!yg[m.year])yg[m.year]=[];yg[m.year].push(m);});
  Object.keys(yg).sort().forEach(function(year){
    var g=document.createElement('div');g.className='year-group';
    var yl=document.createElement('div');yl.className='year-label';yl.textContent=year;yl.style.width=(yg[year].length*MONTH_WIDTH)+'px';g.appendChild(yl);
    var mr=document.createElement('div');mr.className='month-row';
    yg[year].forEach(function(m){var mc=document.createElement('div');mc.className='month-cell';if(m.month%3===0)mc.classList.add('quarter-start');mc.textContent=(m.month+1)+'月';mr.appendChild(mc);});
    g.appendChild(mr);ma.appendChild(g);
  });
  inner.appendChild(ma); w.appendChild(inner);
}

function buildBody(){
  var container=document.getElementById('ganttInner'); container.innerHTML='';
  container.style.width=(MONTH_WIDTH*months.length+INFO_COL_WIDTH)+'px';
  var groups={}; FILTERED.forEach(function(t){var k=t.projGid;if(!groups[k])groups[k]=[];groups[k].push(t);});
  var sortedKeys=PROJECTS.map(function(p){return p.gid}).filter(function(g){return groups[g]});

  months.forEach(function(m,i){if(m.month%3===0){var ql=document.createElement('div');ql.className='quarter-line';ql.style.left=(INFO_COL_WIDTH+i*MONTH_WIDTH)+'px';container.appendChild(ql);}});
  var todayX=dateToX(getTodayStr());
  if(todayX!==null){var tl=document.createElement('div');tl.className='today-line';tl.style.left=(INFO_COL_WIDTH+todayX)+'px';var tlab=document.createElement('div');tlab.className='today-label';tlab.textContent='TODAY';tl.appendChild(tlab);container.appendChild(tl);}

  sortedKeys.forEach(function(projGid){
    var proj=PROJECTS.find(function(p){return p.gid===projGid});
    var tasks=groups[projGid];
    var cc=tasks.filter(function(t){return t.c||t.st==='完了'}).length;
    var pct=tasks.length>0?Math.round((cc/tasks.length)*100):0;

    var gh=document.createElement('div');gh.className='group-header';
    var ghI=document.createElement('div');ghI.className='row-info';ghI.style.background=proj.color;
    var ghN=document.createElement('div');ghN.className='col-name';ghN.innerHTML=proj.name+'<span class="group-count">('+tasks.length+'件)</span>';ghI.appendChild(ghN);
    var ghP=document.createElement('div');ghP.className='group-progress';ghP.textContent='進捗 '+pct+'% ('+cc+'/'+tasks.length+')';ghI.appendChild(ghP);
    gh.appendChild(ghI);var ghB=document.createElement('div');ghB.className='row-bars';gh.appendChild(ghB);container.appendChild(gh);

    tasks.sort(function(a,b){var ao=getDueClass(a)==='overdue'?0:1,bo=getDueClass(b)==='overdue'?0:1;if(ao!==bo)return ao-bo;if(a.d&&b.d)return a.d.localeCompare(b.d);if(a.d)return-1;if(b.d)return 1;return a.n.localeCompare(b.n,'ja');});

    tasks.forEach(function(task){
      var row=document.createElement('div');row.className='gantt-row';row.dataset.gid=task.gid;
      var info=document.createElement('div');info.className='row-info';
      var nd=document.createElement('div');nd.className='col-name';
      var dot=document.createElement('div');dot.className='status-dot '+getStatusClass(task);nd.appendChild(dot);
      if(task.t==='milestone'){var msi=document.createElement('div');msi.className='ms-icon';nd.appendChild(msi);}
      var hasSub=task.ns>0&&SUBTASKS[task.gid]&&SUBTASKS[task.gid].length>0;
      if(hasSub){
        var arrow=document.createElement('span');arrow.className='toggle-arrow';arrow.textContent='▶';arrow.dataset.gid=task.gid;
        arrow.addEventListener('click',function(e){e.stopPropagation();var g=this.dataset.gid;var exp=this.textContent==='▼';this.textContent=exp?'▶':'▼';document.querySelectorAll('.subtask-row[data-parent="'+g+'"]').forEach(function(r){r.classList.toggle('visible',!exp);});});
        nd.appendChild(arrow);
      }
      var nt=document.createElement('span');nt.className='task-name-text';nt.textContent=task.n;nd.appendChild(nt);
      if(hasSub){var badge=document.createElement('span');badge.className='subtask-badge';badge.textContent='('+SUBTASKS[task.gid].length+')';nd.appendChild(badge);}
      info.appendChild(nd);

      var pd=document.createElement('div');pd.className='col-proj';
      var pb=document.createElement('span');pb.className='proj-badge';pb.style.background=task.projColor+'22';pb.style.color=task.projColor;pb.style.border='1px solid '+task.projColor+'44';pb.textContent=task.projShort;pd.appendChild(pb);info.appendChild(pd);

      var ad=document.createElement('div');ad.className='col-assignee';ad.textContent=task.assignee||'−';ad.title=task.assignee||'';info.appendChild(ad);
      var dd=document.createElement('div');dd.className='col-due '+getDueClass(task);dd.textContent=formatDue(task.d);info.appendChild(dd);
      var sd=document.createElement('div');sd.className='col-status';var chip=document.createElement('span');chip.className='status-chip '+getStatusClass(task);chip.textContent=getStatusLabel(task);sd.appendChild(chip);info.appendChild(sd);
      row.appendChild(info);

      var ba=document.createElement('div');ba.className='row-bars';
      if(task.t==='milestone'){var dx=dateToX(task.d);if(dx!==null){var dm=document.createElement('div');dm.className='milestone-marker '+getStatusClass(task);dm.style.left=(dx-7)+'px';dm.addEventListener('mouseenter',showTooltip.bind(null,task));dm.addEventListener('mouseleave',hideTooltip);ba.appendChild(dm);}}
      else{var s0=task.s||task.d,e0=task.d;if(s0&&e0){var sx=dateToX(s0),ex=dateToX(e0);if(sx!==null&&ex!==null){var bar=document.createElement('div');bar.className='gantt-bar '+getStatusClass(task);bar.style.left=sx+'px';bar.style.width=Math.max(ex-sx,4)+'px';bar.addEventListener('mouseenter',showTooltip.bind(null,task));bar.addEventListener('mouseleave',hideTooltip);ba.appendChild(bar);}}}
      row.appendChild(ba);container.appendChild(row);

      if(hasSub){var ps=task.s||task.d,pe=task.d;SUBTASKS[task.gid].forEach(function(st){
        var sr=document.createElement('div');sr.className='gantt-row subtask-row';sr.dataset.parent=task.gid;
        var si=document.createElement('div');si.className='row-info';
        var sn=document.createElement('div');sn.className='col-name';var stx=document.createElement('span');stx.className='task-name-text';stx.textContent=st.n;sn.appendChild(stx);si.appendChild(sn);
        var sp=document.createElement('div');sp.className='col-proj';si.appendChild(sp);
        var sa=document.createElement('div');sa.className='col-assignee';si.appendChild(sa);
        var sdd=document.createElement('div');sdd.className='col-due';si.appendChild(sdd);
        var sss=document.createElement('div');sss.className='col-status';si.appendChild(sss);
        sr.appendChild(si);
        var sb=document.createElement('div');sb.className='row-bars';
        if(ps&&pe){var sx2=dateToX(ps),ex2=dateToX(pe);if(sx2!==null&&ex2!==null){var ln=document.createElement('div');ln.className='subtask-line';ln.style.left=sx2+'px';ln.style.width=Math.max(ex2-sx2,4)+'px';sb.appendChild(ln);}}
        sr.appendChild(sb);container.appendChild(sr);
      });}
    });
  });
}

var tooltipEl=document.getElementById('tooltip');
function showTooltip(task,e){
  var lines=['<strong>'+task.n+'</strong>','プロジェクト: '+task.proj];
  if(task.assignee)lines.push('担当: '+task.assignee);
  if(task.s)lines.push('開始: '+task.s);
  if(task.d)lines.push('期日: '+task.d);
  lines.push('ステータス: '+getStatusLabel(task));
  if(task.t==='milestone')lines.push('種別: マイルストーン');
  if(task.tag)lines.push('タグ: '+task.tag);
  tooltipEl.innerHTML=lines.join('<br>');tooltipEl.style.display='block';positionTooltip(e);
}
function positionTooltip(e){tooltipEl.style.left=(e.clientX+12)+'px';tooltipEl.style.top=(e.clientY+12)+'px';}
function hideTooltip(){tooltipEl.style.display='none';}
document.addEventListener('mousemove',function(e){if(tooltipEl.style.display==='block')positionTooltip(e);});

function updateHeader(){
  document.getElementById('taskCount').textContent=DATA.length+' tasks (8 projects)';
  if(lastFetchTime){var h=String(lastFetchTime.getHours()).padStart(2,'0'),m=String(lastFetchTime.getMinutes()).padStart(2,'0');document.getElementById('lastUpdate').textContent='最終取得 '+h+':'+m;}
}
function rebuildChart(){updateHeader();buildTimelineHeader();buildBody();syncScroll();setTimeout(scrollToToday,100);}
function showError(msg){document.getElementById('errorMsg').textContent=msg;document.getElementById('errorBanner').classList.add('visible');}
function hideError(){document.getElementById('errorBanner').classList.remove('visible');}
function syncScroll(){var b=document.getElementById('ganttBody'),h=document.getElementById('timelineHeader');b.addEventListener('scroll',function(){h.scrollLeft=b.scrollLeft;});}
function scrollToToday(){var b=document.getElementById('ganttBody'),tx=dateToX(getTodayStr());if(tx!==null)b.scrollLeft=Math.max(0,tx-200);}

function setPreset(p){
  if(activePreset===p){activePreset=null;}else{activePreset=p;}
  document.querySelectorAll('.preset-btn').forEach(function(b){b.classList.remove('active');});
  if(activePreset){var id=activePreset==='audit'?'presetAudit':activePreset==='urgent'?'presetUrgent':'presetActive';document.getElementById(id).classList.add('active');}
  applyFilters();
}
document.getElementById('presetAudit').addEventListener('click',function(){setPreset('audit');});
document.getElementById('presetUrgent').addEventListener('click',function(){setPreset('urgent');});
document.getElementById('presetActive').addEventListener('click',function(){setPreset('active');});

document.getElementById('refreshBtn').addEventListener('click',async function(){this.classList.add('loading');this.disabled=true;await loadData();this.classList.remove('loading');this.disabled=false;});
document.getElementById('settingsBtn').addEventListener('click',function(){document.getElementById('patInput').value=getPAT();document.getElementById('patDialog').classList.remove('hidden');});
document.getElementById('patSave').addEventListener('click',function(){var pat=document.getElementById('patInput').value.trim();if(!pat)return;savePAT(pat);document.getElementById('patDialog').classList.add('hidden');loadData();});
document.getElementById('patInput').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('patSave').click();});
document.getElementById('closeErr').addEventListener('click',hideError);

['filterType','filterStatus','filterAssignee','filterProject'].forEach(function(id){document.getElementById(id).addEventListener('change',applyFilters);});
document.getElementById('filterSearch').addEventListener('input',applyFilters);
document.getElementById('filterReset').addEventListener('click',function(){
  document.getElementById('filterType').value='all';document.getElementById('filterStatus').value='all';
  document.getElementById('filterAssignee').value='all';document.getElementById('filterProject').value='all';
  document.getElementById('filterSearch').value='';activePreset=null;
  document.querySelectorAll('.preset-btn').forEach(function(b){b.classList.remove('active');});
  applyFilters();
});

(async function init(){
  if(!getPAT()){document.getElementById('patDialog').classList.remove('hidden');}
  else{await loadData();}
})();
</script>
</body>
</html>
